<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-labelledby="t">
  <title id="t">Huseyin Karatas, founder of ARCY AI and full-stack engineer, Istanbul</title>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8a3d"/>
      <stop offset=".33" stop-color="#ec3b21"/>
      <stop offset=".66" stop-color="#d9327c"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a3d"/>
      <stop offset=".33" stop-color="#ec3b21"/>
      <stop offset=".66" stop-color="#d9327c"/>
      <stop offset="1" stop-color="#8b5cf6"/>
      <animateTransform attributeName="gradientTransform" type="rotate" values="0 .5 .5;360 .5 .5" dur="12s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1">
      <stop offset="0" stop-color="#ec3b21" stop-opacity=".24"/>
      <stop offset="1" stop-color="#ec3b21" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="1" cy=".5" r=".7">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".22"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity=".07"/>
    </pattern>
    <radialGradient id="fade" cx=".75" cy=".5" r=".6">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="dotMask"><rect width="1000" height="260" fill="url(#fade)"/></mask>
    <clipPath id="card"><rect width="1000" height="260" rx="20"/></clipPath>
    <clipPath id="typed"><rect class="type" x="48" y="196" width="625" height="26"/></clipPath>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .rise { animation: rise .9s cubic-bezier(.2,.7,.2,1) backwards; }
    .type { transform-origin: 48px 0; animation: type 2.8s steps(69) 1s backwards; }
    .cursor { animation: cur 2.8s steps(69) 1s backwards, blink 1.1s step-end infinite; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2s ease-out infinite; }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } }
    @keyframes type { from { transform: scaleX(0); } }
    @keyframes cur { from { transform: translateX(-621px); } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes pulse { 0% { transform: scale(1); opacity: .7; } 100% { transform: scale(3); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .rise, .type, .cursor, .pulse { animation: none; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1000" height="260" fill="#0a0d14"/>
    <rect width="1000" height="260" fill="url(#dots)" mask="url(#dotMask)"/>
    <rect width="1000" height="260" fill="url(#glowA)"/>
    <rect width="1000" height="260" fill="url(#glowB)"/>

    <g transform="translate(850 130)" fill="none" stroke="url(#brand)">
      <g opacity=".55">
        <circle r="58" stroke-width="1.2"/>
        <g><circle cx="58" r="4" fill="#ff8a3d" stroke="none"/>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/></g>
      </g>
      <g opacity=".35">
        <circle r="92" stroke-width="1" stroke-dasharray="2 7"/>
        <g><circle cx="-92" r="3.5" fill="#d9327c" stroke="none"/>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="16s" repeatCount="indefinite"/></g>
      </g>
      <g opacity=".22">
        <circle r="126" stroke-width="1"/>
        <g><circle cy="-126" r="3" fill="#8b5cf6" stroke="none"/>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="26s" repeatCount="indefinite"/></g>
      </g>
      <circle r="20" fill="url(#brand)" stroke="none" opacity=".9"/>
      <circle r="20" fill="url(#brand)" stroke="none" class="pulse" opacity=".5"/>
    </g>
  </g>
  <rect x=".75" y=".75" width="998.5" height="258.5" rx="19.5" fill="none" stroke="url(#ring)" stroke-width="1.5" opacity=".75"/>

  <g class="rise">
    <rect x="48" y="36" width="168" height="28" rx="14" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".1"/>
    <circle cx="64" cy="50" r="3.5" fill="#ff8a3d" class="pulse"/>
    <circle cx="64" cy="50" r="3.5" fill="#ff8a3d"/>
    <text x="76" y="54.5" font-size="13" font-weight="600" fill="#c9d1dc">Istanbul, Türkiye</text>
  </g>
  <text x="46" y="130" font-size="58" font-weight="800" letter-spacing="-1.5" fill="url(#brand)" class="rise" style="animation-delay:.15s">Huseyin Karatas</text>
  <text x="48" y="168" font-size="20" font-weight="500" fill="#c9d1dc" class="rise" style="animation-delay:.3s">Founder of ARCY AI  ·  Full-stack engineer</text>
  <g clip-path="url(#typed)">
    <text x="48" y="214" font-size="15" fill="#8b95a7" class="mono" textLength="621" lengthAdjust="spacingAndGlyphs"><tspan fill="#ff8a3d">$</tspan> building an in-product agent that answers customers inside your app</text>
  </g>
  <rect x="672" y="200" width="9" height="18" rx="1.5" fill="#ff8a3d" class="cursor"/>
</svg>
